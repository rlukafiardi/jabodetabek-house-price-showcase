[project]
name = "jabodetabek-house-price"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "kaleido>=1.5.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "selectolax>=1.0.2",
    "shapely>=2.2.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
serving = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

# One grouped PR per ecosystem per month.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
